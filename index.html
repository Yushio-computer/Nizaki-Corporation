<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>神埼鉄道 運行情報・特急予約</title>

    <!-- PWA & Web Push Meta Tags -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#521EB7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="神埼鉄道" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icon.png" />

    <!-- Preload critical splash images -->
    <link rel="preload" href="./splash-sp.png" as="image" />
    <link rel="preload" href="./splash-pc.png" as="image" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #521EB7; /* 白画面を一瞬も出さず神埼パープルで即時表示 */
      }
      #root {
        min-height: 100%;
      }
      .splash-screen {
        position: fixed;
        inset: 0;
        background-color: #521EB7;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .splash-sp {
        display: flex;
        width: 100vw;
        height: 100vh;
        align-items: center;
        justify-content: center;
      }
      .splash-pc {
        display: none;
        width: 100vw;
        height: 100vh;
        align-items: center;
        justify-content: center;
      }
      @media (min-width: 640px) and (min-aspect-ratio: 1/1) {
        .splash-sp { display: none !important; }
        .splash-pc { display: flex !important; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" class="splash-screen">
        <div class="splash-sp">
          <img src="./splash-sp.png" alt="神埼鉄道" style="width: 100%; height: 100%; object-fit: cover;" fetchpriority="high" />
        </div>
        <div class="splash-pc">
          <img src="./splash-pc.png" alt="神埼鉄道" style="width: 100%; height: 100%; object-fit: cover;" fetchpriority="high" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
